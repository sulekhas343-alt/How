name: Build Demon Coach

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    name: Build Android64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64

      - name: Upload Geode file
        uses: actions/upload-artifact@v4
        with:
          name: Demon-Coach-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
